<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 0;
            width: 100%;
            max-width: 720px;
            display: flex;
            gap: 0;
            overflow: hidden;
        }

        .password-section {
            flex: 1;
            padding: 20px;
            background: #f8f9fa;
            max-height: 600px;
            overflow-y: auto;
        }

        .settings-section {
            flex: 1;
            padding: 30px;
            background: #ffffff;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .title-row h1 {
            margin-bottom: 0;
            text-align: left;
        }

        .language-toggle-btn {
            background: #f8f9fa;
            border: 1px solid #d9d9d9;
            color: #555;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.3s, border-color 0.3s;
            flex-shrink: 0;
        }

        .language-toggle-btn:hover {
            background: #eef0f3;
            border-color: #c7c7c7;
        }

        .password-list {
            margin-bottom: 15px;
        }

        .password-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .password-text {
            flex: 1;
            padding: 6px 8px;
            font-size: 15px;
            color: #333;
            letter-spacing: 2px;
            word-break: break-all;
        }

        .password-copy-btn {
            background: #667eea;
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .password-copy-btn:hover:not(.copied) {
            background: #5568d3;
        }

        /* 已复制：中性灰（不用 slate 冷灰，避免在屏上偏青绿） */
        .password-copy-btn.copied {
            background: #9e9e9e;
        }

        .password-copy-btn.copied:hover {
            background: #737373;
        }

        .copy-all-container {
            text-align: right;
            padding-right: 8px;
        }

        .copy-all-btn {
            background: #28a745;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .copy-all-btn:hover {
            background: #218838;
        }

        .slider-container {
            margin-bottom: 18px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .slider-value {
            color: #667eea;
            font-weight: 600;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .exclude-container, .custom-symbols-container {
            margin-bottom: 18px;
        }

        .input-label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .text-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        .text-input:focus {
            border-color: #667eea;
        }

        .options-container {
            margin-bottom: 20px;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .option-item:last-child {
            border-bottom: none;
        }

        .option-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .option-label {
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .generate-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .version-info {
            text-align: center;
            margin-top: 12px;
            font-size: 12px;
            color: #999;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 640px) {
            body {
                padding: 10px;
            }
            .container {
                flex-direction: column;
                max-height: none;
            }
            .password-section {
                max-height: 400px;
                order: 2;
            }
            .settings-section {
                order: 1;
                padding: 20px;
            }
            h1 {
                font-size: 20px;
            }
            .title-row {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="password-section">
            <h1 data-i18n="generatedPasswords">生成的密码</h1>
            <div class="password-list" id="passwordList"></div>
            <div class="copy-all-container" id="copyAllContainer" style="display: none;">
                <button class="copy-all-btn" id="copyAllBtn" data-i18n="copyAll">一键全部复制</button>
            </div>
        </div>

        <div class="settings-section">
            <div class="title-row">
                <h1 data-i18n="appTitle">随机密码生成器</h1>
                <button class="language-toggle-btn" id="languageToggleBtn" type="button">English</button>
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span data-i18n="passwordLength">密码长度</span>
                    <span class="slider-value" id="lengthValue">12</span>
                </div>
                <input type="range" class="slider" id="lengthSlider" min="1" max="20" value="12">
            </div>

            <div class="slider-container">
                <div class="slider-label">
                    <span data-i18n="passwordCount">生成个数</span>
                    <span class="slider-value" id="countValue">5</span>
                </div>
                <input type="range" class="slider" id="countSlider" min="1" max="20" value="5">
            </div>

            <div class="exclude-container">
                <label class="input-label" for="excludeInput" data-i18n="excludeChars">排除字符</label>
                <input type="text" class="text-input" id="excludeInput" value="~^()" data-i18n-placeholder="excludePlaceholder" placeholder="例如: ~^()">
            </div>

            <div class="options-container">
                <div class="option-item">
                    <span class="option-label" data-i18n="includeUppercase">包含大写字母 (A-Z)</span>
                    <input type="checkbox" id="uppercase" class="checkbox" checked>
                </div>
                <div class="option-item">
                    <span class="option-label" data-i18n="includeLowercase">包含小写字母 (a-z)</span>
                    <input type="checkbox" id="lowercase" class="checkbox" checked>
                </div>
                <div class="option-item">
                    <span class="option-label" data-i18n="includeNumbers">包含数字 (0-9)</span>
                    <input type="checkbox" id="numbers" class="checkbox" checked>
                </div>
                <div class="option-item">
                    <div class="option-left">
                        <span class="option-label" data-i18n="includeSymbols">包含特殊符号</span>
                    </div>
                    <input type="checkbox" id="symbols" class="checkbox" checked>
                </div>
                <div class="custom-symbols-container">
                    <label class="input-label" for="customSymbolsInput" data-i18n="customSymbols">自定义特殊符号</label>
                    <input type="text" class="text-input" id="customSymbolsInput" value="!@#$%&*" data-i18n-placeholder="customSymbolsPlaceholder" placeholder="例如: !@#$%&*">
                </div>
                <div class="option-item">
                    <span class="option-label" data-i18n="forceUppercaseFirst">首字母强制大写</span>
                    <input type="checkbox" id="forceUppercaseFirst" class="checkbox" checked>
                </div>
            </div>

            <button class="generate-btn" id="generateBtn" data-i18n="generatePassword">生成密码</button>
            <div class="version-info" data-i18n="versionInfo">v1.10 - 新增中英文切换和自动语言识别</div>
        </div>
    </div>

    <div class="toast" id="toast">已复制到剪贴板</div>

    <script>
        const defaultUppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const defaultLowercase = 'abcdefghijklmnopqrstuvwxyz';
        const defaultNumbers = '0123456789';
        const defaultSymbols = '!@#$%&*';

        // 默认屏蔽的常见弱密码关键词
        const blockedKeywords = [
            'password', 'passwd', 'pass', 'admin', 'root', 'user', 'test',
            'guest', 'hello', 'world', 'love', 'sex', 'god', 'dog', 'cat',
            '123456', '12345', '1234', '6666', '8888', '0000', '1111',
            'abc', 'qwe', 'asd', 'zxc', 'aaa', 'bbb', 'ccc',
            'admin', 'root', 'user', 'login', 'welcome', 'changeme',
            'secret', 'master', 'hello', 'dragon', 'baseball', 'football',
            'qwerty', 'asdfgh', 'zxcvbn'
        ];

        const translations = {
            zh: {
                pageTitle: '随机密码生成器',
                appTitle: '随机密码生成器',
                generatedPasswords: '生成的密码',
                passwordLength: '密码长度',
                passwordCount: '生成个数',
                excludeChars: '排除字符',
                excludePlaceholder: '例如: ~^()',
                includeUppercase: '包含大写字母 (A-Z)',
                includeLowercase: '包含小写字母 (a-z)',
                includeNumbers: '包含数字 (0-9)',
                includeSymbols: '包含特殊符号',
                customSymbols: '自定义特殊符号',
                customSymbolsPlaceholder: '例如: !@#$%&*',
                forceUppercaseFirst: '首字母强制大写',
                generatePassword: '生成密码',
                copyAll: '一键全部复制',
                copy: '复制',
                copied: '已复制到剪贴板',
                copiedCount: '已复制 {count} 个密码',
                noPasswords: '请先生成密码',
                generateError: '所有字符都被排除了，请调整设置',
                languageToggle: 'English',
                languageToggleTitle: 'Switch to English',
                versionInfo: 'v1.10 - 新增中英文切换和自动语言识别'
            },
            en: {
                pageTitle: 'Random Password Generator',
                appTitle: 'Random Password Generator',
                generatedPasswords: 'Generated Passwords',
                passwordLength: 'Password Length',
                passwordCount: 'Quantity',
                excludeChars: 'Excluded Characters',
                excludePlaceholder: 'Example: ~^()',
                includeUppercase: 'Include Uppercase Letters (A-Z)',
                includeLowercase: 'Include Lowercase Letters (a-z)',
                includeNumbers: 'Include Numbers (0-9)',
                includeSymbols: 'Include Special Symbols',
                customSymbols: 'Custom Special Symbols',
                customSymbolsPlaceholder: 'Example: !@#$%&*',
                forceUppercaseFirst: 'Force First Letter Uppercase',
                generatePassword: 'Generate Passwords',
                copyAll: 'Copy All',
                copy: 'Copy',
                copied: 'Copied to clipboard',
                copiedCount: 'Copied {count} passwords',
                noPasswords: 'Please generate passwords first',
                generateError: 'All characters are excluded. Please adjust the settings.',
                languageToggle: '中文',
                languageToggleTitle: '切换到中文',
                versionInfo: 'v1.10 - Added Chinese/English switching and automatic language detection'
            }
        };

        const STORAGE_KEY = 'password_generator_settings';
        const LANGUAGE_KEY = 'password_generator_language';
        const SETTINGS_VERSION = 2;
        const MAX_STORAGE_SIZE = 5 * 1024 * 1024; // 5MB 上限

        const passwordList = document.getElementById('passwordList');

        const copyAllContainer = document.getElementById('copyAllContainer');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const countSlider = document.getElementById('countSlider');
        const countValue = document.getElementById('countValue');
        const excludeInput = document.getElementById('excludeInput');
        const customSymbolsInput = document.getElementById('customSymbolsInput');
        const uppercaseCheckbox = document.getElementById('uppercase');
        const lowercaseCheckbox = document.getElementById('lowercase');
        const numbersCheckbox = document.getElementById('numbers');
        const symbolsCheckbox = document.getElementById('symbols');
        const forceUppercaseFirstCheckbox = document.getElementById('forceUppercaseFirst');
        const generateBtn = document.getElementById('generateBtn');
        const languageToggleBtn = document.getElementById('languageToggleBtn');
        const toast = document.getElementById('toast');

        let currentPasswords = [];
        let currentLanguage = getInitialLanguage();

        function getInitialLanguage() {
            const savedLanguage = localStorage.getItem(LANGUAGE_KEY);
            if (savedLanguage === 'zh' || savedLanguage === 'en') {
                return savedLanguage;
            }
            if (!navigator.language) {
                return 'zh';
            }
            return navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
        }

        function t(key, params = {}) {
            let text = translations[currentLanguage][key] || translations.zh[key] || key;
            Object.keys(params).forEach(name => {
                text = text.replace(`{${name}}`, params[name]);
            });
            return text;
        }

        function applyLanguage() {
            document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(element => {
                element.textContent = t(element.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                element.placeholder = t(element.dataset.i18nPlaceholder);
            });
            languageToggleBtn.textContent = t('languageToggle');
            languageToggleBtn.title = t('languageToggleTitle');
            document.querySelectorAll('.password-copy-btn').forEach(btn => {
                btn.title = t('copy');
            });
        }

        function switchLanguage() {
            currentLanguage = currentLanguage === 'zh' ? 'en' : 'zh';
            localStorage.setItem(LANGUAGE_KEY, currentLanguage);
            applyLanguage();
        }

        // 计算当前 localStorage 已使用的总大小（字节）
        function getTotalStorageUsed() {
            let total = 0;
            for (let key in localStorage) {
                if (localStorage.hasOwnProperty(key)) {
                    total += localStorage[key].length;
                }
            }
            // JavaScript 字符串是 UTF-16，每个字符占 2 字节
            return total * 2;
        }

        // 保存当前设置到本地存储，带 5MB 上限检查
        function saveSettings() {
            const settings = {
                version: SETTINGS_VERSION,
                length: parseInt(lengthSlider.value),
                count: parseInt(countSlider.value),
                exclude: excludeInput.value,
                uppercase: uppercaseCheckbox.checked,
                lowercase: lowercaseCheckbox.checked,
                numbers: numbersCheckbox.checked,
                symbols: symbolsCheckbox.checked,
                customSymbols: customSymbolsInput.value,
                forceUppercaseFirst: forceUppercaseFirstCheckbox.checked,
                language: currentLanguage,
                timestamp: Date.now()
            };
            try {
                const jsonStr = JSON.stringify(settings);
                const currentUsed = getTotalStorageUsed();
                const newDataSize = jsonStr.length * 2;

                // 如果加上新数据超过 5MB 上限，尝试清理当前项目数据后再存
                if (currentUsed + newDataSize > MAX_STORAGE_SIZE) {
                    // 移除当前项目数据再试
                    localStorage.removeItem(STORAGE_KEY);
                    if (getTotalStorageUsed() + newDataSize > MAX_STORAGE_SIZE) {
                        // 还是超限，不保存，让用户知道
                        console.warn('LocalStorage exceeds 5MB limit, settings not saved');
                        return;
                    }
                }
                localStorage.setItem(STORAGE_KEY, jsonStr);
            } catch (e) {
                console.warn('Failed to save settings', e);
            }
        }

        // 从本地存储加载设置
        function loadSettings() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const settings = JSON.parse(saved);
                    if (settings.length) {
                        lengthSlider.value = settings.length;
                        lengthValue.textContent = settings.length;
                    }
                    if (settings.count) {
                        countSlider.value = settings.count;
                        countValue.textContent = settings.count;
                    }
                    if (settings.version === SETTINGS_VERSION && typeof settings.exclude === 'string') {
                        excludeInput.value = settings.exclude;
                    }
                    if (typeof settings.uppercase === 'boolean') {
                        uppercaseCheckbox.checked = settings.uppercase;
                    }
                    if (typeof settings.lowercase === 'boolean') {
                        lowercaseCheckbox.checked = settings.lowercase;
                    }
                    if (typeof settings.numbers === 'boolean') {
                        numbersCheckbox.checked = settings.numbers;
                    }
                    if (typeof settings.symbols === 'boolean') {
                        symbolsCheckbox.checked = settings.symbols;
                    }
                    if (typeof settings.customSymbols === 'string') {
                        customSymbolsInput.value = settings.customSymbols;
                    }
                    if (typeof settings.forceUppercaseFirst === 'boolean') {
                        forceUppercaseFirstCheckbox.checked = settings.forceUppercaseFirst;
                    }
                    if ((settings.language === 'zh' || settings.language === 'en') && !localStorage.getItem(LANGUAGE_KEY)) {
                        currentLanguage = settings.language;
                        localStorage.setItem(LANGUAGE_KEY, currentLanguage);
                    }
                }
            } catch (e) {
                console.warn('Failed to load settings', e);
            }
        }

        lengthSlider.addEventListener('input', (e) => {
            lengthValue.textContent = e.target.value;
        });

        countSlider.addEventListener('input', (e) => {
            countValue.textContent = e.target.value;
        });

        function getExcludedChars() {
            const input = excludeInput.value.trim();
            if (!input) return [];
            return [...new Set(input.split(''))];
        }

        function getCustomSymbols() {
            const input = customSymbolsInput.value.trim();
            return input || defaultSymbols;
        }

        function filterChars(chars, excluded) {
            return chars.split('').filter(c => !excluded.includes(c)).join('');
        }

        function containsBlockedKeyword(password) {
            const lowerPwd = password.toLowerCase();
            for (const keyword of blockedKeywords) {
                if (lowerPwd.includes(keyword)) {
                    return true;
                }
            }
            return false;
        }

        function getRandomInt(max) {
            const range = 0x100000000;
            const limit = range - (range % max);
            const randomValues = new Uint32Array(1);

            do {
                crypto.getRandomValues(randomValues);
            } while (randomValues[0] >= limit);

            return randomValues[0] % max;
        }

        function getRandomChar(chars) {
            return chars[getRandomInt(chars.length)];
        }

        function generateSinglePassword(length, excluded) {
            // 预处理各类型字符
            const available = {
                letters: '',
                numbers: '',
                symbols: ''
            };

            const uppercase = filterChars(defaultUppercase, excluded);
            const lowercase = filterChars(defaultLowercase, excluded);
            available.numbers = filterChars(defaultNumbers, excluded);
            available.symbols = filterChars(getCustomSymbols(), excluded);

            if (uppercaseCheckbox.checked && uppercase.length > 0) {
                available.letters += uppercase;
            }
            if (lowercaseCheckbox.checked && lowercase.length > 0) {
                available.letters += lowercase;
            }
            if (!numbersCheckbox.checked) {
                available.numbers = '';
            }
            if (!symbolsCheckbox.checked) {
                available.symbols = '';
            }

            // 收集启用的类型
            const enabledTypes = Object.keys(available).filter(type => available[type].length > 0);

            if (enabledTypes.length === 0) {
                return null;
            }

            // 计算每种启用类型至少需要多少位（25%）
            const minCount = {};
            let totalMin = 0;
            enabledTypes.forEach(type => {
                minCount[type] = Math.ceil(length * 0.25);
                // 如果启用类型少，确保不超过总长度
                if (minCount[type] * enabledTypes.length > length) {
                    minCount[type] = Math.floor(length / enabledTypes.length);
                }
                totalMin += minCount[type];
            });

            // 如果最小总和超过长度，按比例缩小
            if (totalMin > length) {
                const scale = length / totalMin;
                totalMin = 0;
                enabledTypes.forEach(type => {
                    minCount[type] = Math.max(1, Math.floor(minCount[type] * scale));
                    totalMin += minCount[type];
                });
            }

            // 分配剩余位置
            let remaining = length - totalMin;
            while (remaining > 0) {
                const randomType = enabledTypes[getRandomInt(enabledTypes.length)];
                minCount[randomType]++;
                remaining--;
            }

            // 生成密码，确保特殊符号不连续
            let password = [];
            let lastWasSymbol = false;

            // 如果强制首字母大写，优先处理（首字母排除易混淆的 I）
            if (forceUppercaseFirstCheckbox.checked && uppercase.length > 0) {
                // 首字母排除大写 I，避免和 1、小写 i 混淆
                const availableFirstUppercase = uppercase.split('').filter(c => c !== 'I').join('');
                const firstPool = availableFirstUppercase.length > 0 ? availableFirstUppercase : uppercase;
                const firstChar = getRandomChar(firstPool);
                password.push(firstChar);
                // 首字母是字母，减少字母配额
                if (minCount.letters > 0) {
                    minCount.letters--;
                }
                lastWasSymbol = false;
            }

            // 将剩余配额随机分配，确保特殊符号不连续
            while (password.length < length) {
                // 找出还有配额且不违反连续规则的候选类型
                let candidates = enabledTypes.filter(type => minCount[type] > 0);
                if (lastWasSymbol) {
                    candidates = candidates.filter(type => type !== 'symbols');
                }
                if (candidates.length === 0) {
                    // 如果没有候选，只能选择非符号类型（配额用完但必须填充）
                    candidates = enabledTypes.filter(type => type !== 'symbols' && available[type].length > 0);
                }
                if (candidates.length === 0) {
                    break;
                }

                const selectedType = candidates[getRandomInt(candidates.length)];
                const char = getRandomChar(available[selectedType]);
                password.push(char);

                if (minCount[selectedType] > 0) {
                    minCount[selectedType]--;
                }
                lastWasSymbol = (selectedType === 'symbols');
            }

            // 打乱顺序（除了首字母如果强制大写）
            if (forceUppercaseFirstCheckbox.checked && password.length > 1) {
                const first = password[0];
                const rest = password.slice(1);
                // Fisher-Yates 洗牌
                for (let i = rest.length - 1; i > 0; i--) {
                    const j = getRandomInt(i + 1);
                    [rest[i], rest[j]] = [rest[j], rest[i]];
                }
                // 重新检查特殊符号是否连续
                password = [first];
                lastWasSymbol = false;
                for (let i = 0; i < rest.length; i++) {
                    // 如果当前字符是符号且前一个是符号，尝试交换
                    const isSymbol = available.symbols.includes(rest[i]);
                    if (isSymbol && lastWasSymbol) {
                        // 往后找一个非符号交换
                        for (let j = i + 1; j < rest.length; j++) {
                            const jIsSymbol = available.symbols.includes(rest[j]);
                            if (!jIsSymbol) {
                                [rest[i], rest[j]] = [rest[j], rest[i]];
                                break;
                            }
                        }
                    }
                    const currentIsSymbol = available.symbols.includes(rest[i]);
                    password.push(rest[i]);
                    lastWasSymbol = currentIsSymbol;
                }
            } else {
                // 完全打乱后重新调整确保不连续
                // Fisher-Yates 洗牌
                for (let i = password.length - 1; i > 0; i--) {
                    const j = getRandomInt(i + 1);
                    [password[i], password[j]] = [password[j], password[i]];
                }
                // 修复连续符号
                for (let i = 1; i < password.length; i++) {
                    const prevIsSymbol = available.symbols.includes(password[i-1]);
                    const currIsSymbol = available.symbols.includes(password[i]);
                    if (prevIsSymbol && currIsSymbol) {
                        // 往后找一个非符号交换
                        let found = false;
                        for (let j = i + 1; j < password.length; j++) {
                            if (!available.symbols.includes(password[j])) {
                                [password[i], password[j]] = [password[j], password[i]];
                                found = true;
                                break;
                            }
                        }
                        // 如果没找到，说明大部分都是符号，接受现实（最小25%规则下这种情况很少）
                    }
                }
            }

            const finalPassword = password.join('');
            return finalPassword;
        }

        function generatePasswords() {
            const length = parseInt(lengthSlider.value);
            const count = parseInt(countSlider.value);
            const excluded = getExcludedChars();
            currentPasswords = [];

            let hasError = false;
            // 最多重试 10 次找一个符合规则的密码
            for (let i = 0; i < count; i++) {
                let pwd = null;
                let attempts = 0;
                while (pwd === null && attempts < 10) {
                    pwd = generateSinglePassword(length, excluded);
                    if (pwd !== null && containsBlockedKeyword(pwd)) {
                        pwd = null;
                    }
                    attempts++;
                }
                if (pwd === null) {
                    hasError = true;
                    break;
                }
                currentPasswords.push(pwd);
            }

            if (hasError) {
                showToast(t('generateError'));
                return;
            }

            // 保存当前设置
            saveSettings();

            renderPasswords();
        }

        function renderPasswords() {
            passwordList.innerHTML = '';

            currentPasswords.forEach((pwd, index) => {
                const item = document.createElement('div');
                item.className = 'password-item';

                const text = document.createElement('div');
                text.className = 'password-text';
                text.textContent = pwd;

                const btn = document.createElement('button');
                btn.className = 'password-copy-btn';
                btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
                btn.title = t('copy');
                btn.addEventListener('click', () => copySinglePassword(pwd, btn));

                item.appendChild(text);
                item.appendChild(btn);
                passwordList.appendChild(item);
            });

            if (currentPasswords.length > 1) {
                copyAllContainer.style.display = 'block';
            } else {
                copyAllContainer.style.display = 'none';
            }
        }

        function copySinglePassword(password, btn) {
            navigator.clipboard.writeText(password).then(() => {
                showToast(t('copied'));
                btn.classList.add('copied');
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = password;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast(t('copied'));
                btn.classList.add('copied');
            });
        }

        function copyAllPasswords() {
            if (currentPasswords.length === 0) {
                showToast(t('noPasswords'));
                return;
            }
            const text = currentPasswords.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                showToast(t('copiedCount', { count: currentPasswords.length }));
            }).catch(() => {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast(t('copiedCount', { count: currentPasswords.length }));
            });
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 页面加载时恢复设置
        loadSettings();
        applyLanguage();

        generateBtn.addEventListener('click', generatePasswords);
        copyAllBtn.addEventListener('click', copyAllPasswords);
        languageToggleBtn.addEventListener('click', switchLanguage);

        generatePasswords();
    </script>
</body>
</html>
